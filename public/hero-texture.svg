<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.52  0 0 0 0 0.47  0 0 0 0.05 0"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#14231E" fill-opacity="0.05"/>
    </pattern>
    <pattern id="ruler" width="120" height="26" patternUnits="userSpaceOnUse">
      <line x1="0" y1="14" x2="0" y2="26" stroke="#14231E" stroke-opacity="0.18" stroke-width="1"/>
      <line x1="12" y1="20" x2="12" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="24" y1="20" x2="24" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="36" y1="20" x2="36" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="48" y1="20" x2="48" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="60" y1="16" x2="60" y2="26" stroke="#14231E" stroke-opacity="0.14" stroke-width="1"/>
      <line x1="72" y1="20" x2="72" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="84" y1="20" x2="84" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="96" y1="20" x2="96" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
      <line x1="108" y1="20" x2="108" y2="26" stroke="#14231E" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" filter="url(#grain)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect y="1054" width="1920" height="26" fill="url(#ruler)"/>
</svg>
